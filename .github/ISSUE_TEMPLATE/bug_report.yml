name: Fallo
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. WISPI se probó a fondo en **una sola máquina y con una
        sola voz**: tu caso es información que aquí no existe.

        ⚠️ **Si es un fallo de seguridad, no lo abras aquí.** Ver [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué esperabas y qué salió en su lugar.
      placeholder: |
        Dicté "haz commit y push" en Windows Terminal y no apareció nada.
    validations:
      required: true

  - type: textarea
    id: selftest
    attributes:
      label: Salida de `wispi.selftest --all`
      description: |
        `uv run python -m wispi.selftest --all`

        Es lo que más ahorra: dice si el problema está en el audio, el modelo,
        la inyección o el LLM.
      render: text
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: En qué aplicación
      description: El nombre del ejecutable, no "mi terminal". E indica si la ventana estaba **elevada**.
      placeholder: WindowsTerminal.exe (sin elevar)
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows y CPU
      placeholder: Windows 11 24H2 · Ryzen 7 5800X (8 núcleos)
    validations:
      required: true

  - type: dropdown
    id: teclado
    attributes:
      label: Distribución de teclado
      options:
        - Español (España)
        - Español (Latinoamérica)
        - Inglés (US)
        - Otra
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. Abro Windows Terminal
        2. Mantengo Ctrl+Win y digo "..."
        3. Suelto
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs (opcional)
      description: |
        Las últimas líneas de `logs/wispi.log`.

        ⚠️ **Míralas antes de pegarlas.** Si alguna vez pusiste
        `logging.include_text: true`, tus logs contienen lo que dictaste.
      render: text
    validations:
      required: false
